name: Deploy S3-SQS-Lambda Pipeline

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ARTIFACT_BUCKET: lambda-artifacts-${{ secrets.AWS_ACCOUNT_ID }}-${{ secrets.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create artifacts bucket (if not exists)
        run: |
          aws s3 mb s3://lambda-artifacts-${{ secrets.AWS_ACCOUNT_ID }}-${{ secrets.AWS_REGION }} || true

      - name: Package Lambda
        run: |
          cd lambda
          zip -r function.zip .

      - name: Upload Lambda artifact
        run: |
          aws s3 cp lambda/function.zip \
            s3://lambda-artifacts-${{ secrets.AWS_ACCOUNT_ID }}-${{ secrets.AWS_REGION }}/function.zip

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name s3-sqs-lambda-stack \
            --capabilities CAPABILITY_NAMED_IAM
